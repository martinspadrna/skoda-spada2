name: RaK v1.5.69 admin rotation fold CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - 'tools/rak-v1569-extract-admin-rotation-fold-css.py'
      - '.github/workflows/rak-v1569-extract-admin-rotation-fold-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move admin rotation fold CSS to owner
        run: python3 tools/rak-v1569-extract-admin-rotation-fold-css.py

      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text()
          a=i.index('styles-interaction-guard.css')
          b=i.index('styles-admin-rotation-fold.css')
          c=i.index('styles-overrides-legacy-mid.css')
          assert a < b < c
          owner=Path('styles-admin-rotation-fold.css').read_text()
          legacy=Path('styles-overrides-legacy-mid.css').read_text()
          assert '.appMenuFoldSection.adminRotationFold{' in owner
          assert '.rotationViewFold{' not in owner
          assert '.appMenuFoldSection.adminRotationFold{' not in legacy
          assert legacy.startswith('.rotationViewFold{')
          print('admin-rotation-fold owner bytes:',len(owner),'cascade positions:',a,b,c)
          PY

      - name: Full repository check
        run: npm run check

      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1569-extract-admin-rotation-fold-css.yml tools/rak-v1569-extract-admin-rotation-fold-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move admin rotation fold CSS to owner in v1.5.69"
          git push origin development
