name: RaK v1.5.40 safe cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1540-safe-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact v1.5.40 cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dev = Path('rak-dev-fixes-v1512.js')
          dev.write_text("""// RaK DEV v1.5.14 – provozní oprava první ranní směny v měsíci.\n(function () {\n  'use strict';\n\n  function getAllShiftTeams() {\n    try {\n      if (Array.isArray(window.SHIFT_CYCLE_ORDER) && window.SHIFT_CYCLE_ORDER.length) return window.SHIFT_CYCLE_ORDER.slice();\n    } catch (err) {}\n    return ['A', 'B', 'C', 'D'];\n  }\n\n  function findFirstMorningShiftDateInMonth(now) {\n    const d = now instanceof Date ? new Date(now.getTime()) : new Date();\n    const year = d.getFullYear();\n    const monthIndex = d.getMonth();\n    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();\n    const teams = getAllShiftTeams();\n\n    if (typeof window.getTeamShiftState === 'function') {\n      for (let day = 1; day <= daysInMonth; day += 1) {\n        // 09:00 leží bezpečně uvnitř ranní směny 6–18 i ranní 8h směny 6–14.\n        const probe = new Date(year, monthIndex, day, 9, 0, 0, 0);\n        for (const team of teams) {\n          try {\n            const state = window.getTeamShiftState(probe, team);\n            if (!state || !state.active) continue;\n            const label = String(state.label || '').trim();\n            if (/^R/i.test(label) || /rann/i.test(label)) return new Date(year, monthIndex, day, 6, 0, 0, 0);\n          } catch (err) {}\n        }\n      }\n    }\n\n    // Bez směnového enginu je nejbezpečnější obecný význam „první ranní v měsíci“ první den měsíce.\n    return new Date(year, monthIndex, 1, 6, 0, 0, 0);\n  }\n\n  function installFirstMorningCalendarFix() {\n    // stats.js je načtený před tímto modulem. Přepis globálního helperu zajistí,\n    // že Roznýtování není vázané jen na první ranní směny D, ale na první ranní\n    // směnu kteréhokoli týmu v daném měsíci.\n    window.getFirstMorningShiftDateInMonth = findFirstMorningShiftDateInMonth;\n  }\n\n  function boot() {\n    installFirstMorningCalendarFix();\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });\n  else boot();\n\n  window.rakGetFirstMorningShiftDateInMonthAllTeams = findFirstMorningShiftDateInMonth;\n})();\n""", encoding='utf-8')

          replacements = {
            'app.js': [('1.5.39', '1.5.40')],
            'package.json': [('"version": "1.5.39"', '"version": "1.5.40"')],
            'sw.js': [("CACHE_VERSION = 'v1.5.39'", "CACHE_VERSION = 'v1.5.40'")],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Missing expected text in {filename}: {old}')
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')

          smoke = Path('tools/critical-runtime-smoke.mjs')
          text = smoke.read_text(encoding='utf-8')
          old = "assert(devFixes.includes(\"window.addEventListener('pageshow', () => scheduleReportSort())\"), 'Po návratu z externí aplikace se musí zachovat srovnání náhledu reportu');"
          new = "\n".join([
            "assert(!devFixes.includes('scheduleReportSort'), 'Legacy plánování řazení reportu se nesmí vrátit do rak-dev-fixes-v1512.js');",
            "assert(!devFixes.includes('formatShiftReportText'), 'Formátování reportu už nesmí být duplicitně v rak-dev-fixes-v1512.js');",
            "assert(!devFixes.includes('MutationObserver'), 'Legacy reportový MutationObserver už nesmí zůstat v rak-dev-fixes-v1512.js');",
            "assert(devFixes.includes('window.getFirstMorningShiftDateInMonth = findFirstMorningShiftDateInMonth;'), 'Kalendářový fix první ranní směny musí zatím zůstat zachovaný');"
          ])
          if old not in text:
            raise SystemExit('Missing old shift report fallback assertion')
          smoke.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --check rak-dev-fixes-v1512.js
          node --check app.js
          node --check sw.js
          node --check tools/critical-runtime-smoke.mjs

      - name: Run full checks
        run: npm run check

      - name: Commit v1.5.40 and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rak-v1540-safe-cleanup.yml
          git add app.js package.json sw.js rak-dev-fixes-v1512.js tools/critical-runtime-smoke.mjs
          git diff --cached --check
          git commit -m "Remove legacy shift report observer in v1.5.40"
          git push origin HEAD:development
