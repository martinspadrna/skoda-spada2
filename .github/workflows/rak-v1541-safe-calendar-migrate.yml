name: RaK v1.5.41 safe calendar migration
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare safe v1.5.41 calendar migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact native calendar migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stats = Path('stats.js')
          text = stats.read_text()
          start = text.index('function getFirstMorningShiftDateInMonth(now) {')
          end = text.index('\nfunction isSameCalendarDay(a, b) {', start)
          old = text[start:end]
          if 'monthData = app && app.rotation' not in old or 'const candidates = rows' not in old:
              raise SystemExit('Unexpected existing first-morning helper; aborting')
          new = '''function getFirstMorningShiftDateInMonth(now) {
            const d = now instanceof Date ? new Date(now.getTime()) : new Date();
            const year = d.getFullYear();
            const monthIndex = d.getMonth();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            let teams = ['A', 'B', 'C', 'D'];
            try {
              if (Array.isArray(window.SHIFT_CYCLE_ORDER) && window.SHIFT_CYCLE_ORDER.length) teams = window.SHIFT_CYCLE_ORDER.slice();
            } catch (err) {}

            if (typeof window.getTeamShiftState === 'function') {
              for (let day = 1; day <= daysInMonth; day += 1) {
                // 09:00 je bezpečně uvnitř ranní 6–18 i ranní 8h směny 6–14.
                const probe = new Date(year, monthIndex, day, 9, 0, 0, 0);
                for (const team of teams) {
                  try {
                    const state = window.getTeamShiftState(probe, team);
                    if (!state || !state.active) continue;
                    const label = String(state.label || '').trim();
                    if (/^R/i.test(label) || /rann/i.test(label)) return new Date(year, monthIndex, day, 6, 0, 0, 0);
                  } catch (err) {}
                }
              }
            }

            // Bez směnového enginu zachováme bezpečný fallback na první den měsíce.
            return new Date(year, monthIndex, 1, 6, 0, 0, 0);
          }
          '''
          stats.write_text(text[:start] + new + text[end:])

          app = Path('app.js')
          s = app.read_text()
          if s.count('1.5.40') < 2:
              raise SystemExit('Unexpected app.js version state')
          s = s.replace('RAK_MODULE_CACHE_VERSION = "1.5.40"', 'RAK_MODULE_CACHE_VERSION = "1.5.41"', 1)
          s = s.replace('RAK_DEV_UPDATE_BUILD = "v1.5.40"', 'RAK_DEV_UPDATE_BUILD = "v1.5.41"', 1)
          app.write_text(s)

          pkg = Path('package.json')
          s = pkg.read_text()
          if '"version": "1.5.40"' not in s:
              raise SystemExit('Unexpected package version')
          pkg.write_text(s.replace('"version": "1.5.40"', '"version": "1.5.41"', 1))

          sw = Path('sw.js')
          s = sw.read_text()
          if "CACHE_VERSION = 'v1.5.40'" not in s:
              raise SystemExit('Unexpected sw version')
          sw.write_text(s.replace("CACHE_VERSION = 'v1.5.40'", "CACHE_VERSION = 'v1.5.41'", 1))

          smoke = Path('tools/critical-runtime-smoke.mjs')
          s = smoke.read_text()
          anchor = "const qrJs = read('qr.js');\n"
          if "const statsJs = read('stats.js');" not in s:
              if anchor not in s:
                  raise SystemExit('Smoke read anchor missing')
              s = s.replace(anchor, anchor + "const statsJs = read('stats.js');\n", 1)
          guard = "assert(devFixes.includes('window.getFirstMorningShiftDateInMonth = findFirstMorningShiftDateInMonth;'), 'Kalendářový fix první ranní směny musí zatím zůstat zachovaný');\n"
          if guard not in s:
              raise SystemExit('Calendar fallback guard missing')
          extra = (
              "assert(statsJs.includes(\"let teams = ['A', 'B', 'C', 'D'];\"), 'Nativní první ranní směna musí počítat všechny směnové týmy');\n"
              "assert(statsJs.includes(\"Array.isArray(window.SHIFT_CYCLE_ORDER)\"), 'Nativní první ranní směna musí respektovat SHIFT_CYCLE_ORDER');\n"
              "assert(statsJs.includes(\"window.getTeamShiftState(probe, team)\"), 'Nativní první ranní směna musí používat směnový engine pro všechny týmy');\n"
              "assert(!statsJs.includes('const candidates = rows'), 'Stats.js se nesmí vrátit k odvození první ranní jen z importovaných řádků');\n"
          )
          if extra.splitlines()[0] not in s:
              s = s.replace(guard, guard + extra, 1)
          smoke.write_text(s)
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit only after checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rak-v1541-safe-calendar-migrate.yml
          git add stats.js app.js package.json sw.js tools/critical-runtime-smoke.mjs
          git diff --cached --check
          git commit -m "Move first-morning calendar logic into stats in v1.5.41"
          git push origin HEAD:development
