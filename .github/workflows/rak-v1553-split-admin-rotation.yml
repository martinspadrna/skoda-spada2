name: RaK v1.5.53 admin rotation split

on:
  push:
    branches: [development]
    paths:
      - 'tools/rak-v1553-split-admin-rotation.py'
      - '.github/workflows/rak-v1553-split-admin-rotation.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply admin rotation split
        run: python3 tools/rak-v1553-split-admin-rotation.py
      - name: Syntax check touched rotation files
        run: |
          node --check admin-rotation-overtime.js
          node --check admin-rotation-generator.js
          node --check admin-rotation.js
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit split after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/rak-v1553-split-admin-rotation.py .github/workflows/rak-v1553-split-admin-rotation.yml
          git add -A
          git commit -m 'Split admin rotation modules in v1.5.53'
          git push origin development
