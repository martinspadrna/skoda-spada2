name: RaK v1.5.65 shift report CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1565-extract-shift-report-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move shift report CSS to owner
        run: python3 tools/rak-v1565-extract-shift-report-css.py
      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text()
          a=i.index('styles-shift-report.css')
          b=i.index('styles-overrides-legacy-mid.css')
          assert a < b
          owner=Path('styles-shift-report.css').read_text()
          assert '.appMenuReportCard' in owner
          assert '.appMenuReportActions' in owner
          print('shift-report owner bytes:',len(owner),'cascade positions:',a,b)
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1565-extract-shift-report-css.yml tools/rak-v1565-extract-shift-report-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move shift report CSS to owner in v1.5.65"
          git push origin development
