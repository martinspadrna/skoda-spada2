name: RaK v1.5.64 polish CSS dead Games cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1564-clean-polish-game-css.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove dead Games selectors from active polish CSS
        run: python3 tools/rak-v1564-clean-polish-game-css.py
      - name: Verify focused cleanup guard
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit cleanup after checks pass
        run: |
          rm -f .github/workflows/rak-v1564-clean-polish-game-css.yml tools/rak-v1564-clean-polish-game-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dead Games selectors from active CSS in v1.5.64"
          git push origin development
