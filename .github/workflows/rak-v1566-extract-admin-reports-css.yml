name: RaK v1.5.66 admin reports CSS ownership move
# retry after smoke anchor fix

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1566-extract-admin-reports-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move admin reports CSS to owner
        run: python3 tools/rak-v1566-extract-admin-reports-css.py
      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text()
          a=i.index('styles-shift-report.css')
          b=i.index('styles-admin-reports.css')
          c=i.index('styles-overrides-legacy-mid.css')
          assert a < b < c
          owner=Path('styles-admin-reports.css').read_text()
          legacy=Path('styles-overrides-legacy-mid.css').read_text()
          assert '#menu .adminReportsList' in owner
          assert '#menu .adminReportStatus-done' in owner
          assert '#menu .adminReport' not in legacy
          assert 'bomberHeroRunA' not in owner + legacy
          assert 'bomberHeroRunB' not in owner + legacy
          print('admin-reports owner bytes:',len(owner),'cascade positions:',a,b,c)
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1566-extract-admin-reports-css.yml tools/rak-v1566-extract-admin-reports-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move admin reports CSS to owner in v1.5.66"
          git push origin development
