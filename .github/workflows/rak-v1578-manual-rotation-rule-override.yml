name: RaK v1.5.78 manual rotation rule override

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1578-manual-rotation-rule-override.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Implement manual rotation warning override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1) Manual-only validation: same person alone on mills on two consecutive rows.
          path = root / 'admin-rotation.js'
          text = path.read_text(encoding='utf-8')
          anchor = "  adminRotationGeneratorFindConsecutiveTnksIssues(month, monthKey, knownNames).forEach((issue) => {"
          assert anchor in text, 'admin-rotation.js validation anchor missing'
          insert = r'''  // v1.5.78: ruční editor hlídá i stejného člověka samotného na frézkách dvě směny po sobě.
  // Generátor tímto krokem neměníme; tohle varování vzniká jen při skutečné ruční změně před uložením.
  if (opts.source === 'manual-save') {
    const mfkf06IdxManual = adminRotationGeneratorMachineIndex(SOFT_MACHINE_HEADERS, 'MFKF06');
    const mfkf10IdxManual = adminRotationGeneratorMachineIndex(SOFT_MACHINE_HEADERS, 'MFKF10');
    let previousSoloMill = null;
    softRows.forEach((row, rowIdx) => {
      const dateLabel = String(row && row.date || '').trim();
      if (!dateLabel) return;
      const cells = Array.isArray(row && row.cells) ? row.cells : [];
      const mfkf06 = adminRotationCanonicalName(cells[mfkf06IdxManual], knownNames);
      const mfkf10 = adminRotationCanonicalName(cells[mfkf10IdxManual], knownNames);
      const soloName = !mfkf06 && mfkf10 ? mfkf10 : '';
      if (previousSoloMill && soloName && previousSoloMill.name === soloName) {
        addIssue(
          'error',
          'consecutive-solo-mill',
          String(previousSoloMill.dateLabel) + ' -> ' + dateLabel + ': ' + soloName + ' nesmí být sám na frézkách dvě směny po sobě.',
          ''
        );
      }
      previousSoloMill = soloName ? { name: soloName, dateLabel, rowIdx } : null;
    });
  }

'''
          assert 'consecutive-solo-mill' not in text, 'same-month solo-mill rule already exists unexpectedly'
          text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 2) Editor helpers + save override contract.
          path = root / 'admin-rotation-editor.js'
          text = path.read_text(encoding='utf-8')
          start = text.index('async function saveAdminRotationFromDom(monthKey) {')
          end = text.index('\n\n\nfunction adminShowRotationSelectedRemove', start)
          replacement = r'''function adminRotationRuleIssueSignature(issue) {
  const item = issue && typeof issue === 'object' ? issue : {};
  return [item.severity, item.type, item.message, item.detail].map((value) => String(value || '').trim()).join('\u0001');
}

function adminRotationBuildManualRuleOverrideState(monthKey, normalizedMonth) {
  const normalized = normalizedMonth || readAdminRotationFromDom(monthKey);
  const ruleCheck = adminRotationValidateMonthRules(normalized, monthKey, { source: 'manual-save' });
  const baseline = app.rotation && app.rotation.months ? app.rotation.months[monthKey] : null;
  const baselineCheck = baseline
    ? adminRotationValidateMonthRules(baseline, monthKey, { source: 'manual-save' })
    : { ok: true, issues: [] };
  const baselineKeys = new Set((Array.isArray(baselineCheck.issues) ? baselineCheck.issues : []).map(adminRotationRuleIssueSignature));
  const newIssues = (Array.isArray(ruleCheck.issues) ? ruleCheck.issues : [])
    .filter((issue) => !baselineKeys.has(adminRotationRuleIssueSignature(issue)));
  const blockingIssues = newIssues.filter((issue) => issue && issue.severity === 'error');
  return { normalized, ruleCheck, baselineCheck, newIssues, blockingIssues };
}

function adminRotationConfirmManualRuleOverride(state) {
  const blocking = state && Array.isArray(state.blockingIssues) ? state.blockingIssues : [];
  if (!blocking.length) return true;
  const limit = 10;
  const lines = blocking.slice(0, limit).map((issue, idx) => String(idx + 1) + '. ' + String(issue && issue.message || 'Porušení pravidla'));
  if (blocking.length > limit) lines.push('… a dalších ' + String(blocking.length - limit) + ' porušení.');
  const text = [
    'Ruční změna porušuje pravidla rozpisu:',
    '',
    ...lines,
    '',
    'Chceš rozpis přesto uložit?',
    '',
    'OK = Uložit i přes varování',
    'Zrušit = Zpět a opravit'
  ].join('\n');
  return window.confirm(text);
}

async function saveAdminRotationFromDom(monthKey, options) {
  if (!monthKey) throw new Error('Chybí měsíc.');
  const opts = options || {};
  const previousRotationSnapshot = app.rotation ? JSON.parse(JSON.stringify(app.rotation)) : null;
  const normalized = opts.normalizedMonth || readAdminRotationFromDom(monthKey);
  const ruleCheck = opts.ruleCheck || adminRotationValidateMonthRules(normalized, monthKey, { source: opts.manualOverride ? 'manual-save' : 'save' });
  if (!ruleCheck.ok && opts.allowRuleViolations !== true) {
    throw new Error('Rozpis nejde uložit: ' + adminRotationFormatRuleIssues(ruleCheck.issues.filter((issue) => issue.severity === 'error')));
  }
  const candidateRotation = app.rotation ? JSON.parse(JSON.stringify(app.rotation)) : { months: {} };
  if (!candidateRotation.months) candidateRotation.months = {};
  candidateRotation.months[monthKey] = normalized;
  const normalizedRotation = normalizeRotationData(candidateRotation);
  let saveResult = null;
  if (app.adminUnlocked) {
    saveResult = await saveRotationToSupabase(normalizedRotation, { source: 'admin-menu', monthKey });
    if (saveResult && saveResult.ok !== false) {
      if (typeof createRotationSaveBackup === 'function') {
        try { await createRotationSaveBackup(previousRotationSnapshot, monthKey); } catch (err) {}
      }
      if (typeof rakAdminLogChange === 'function') {
        try {
          const overrideCount = Array.isArray(opts.manualOverrideIssues) ? opts.manualOverrideIssues.length : 0;
          await rakAdminLogChange('Rozpis', 'Uložen měsíc ' + String(monthKey || '') + (overrideCount ? ' · ruční výjimky: ' + String(overrideCount) : ''));
        } catch (err) {}
      }
    }
  }
  const manualOverrideIssues = Array.isArray(opts.manualOverrideIssues) ? opts.manualOverrideIssues.slice() : [];
  if (!saveResult || saveResult.ok === false) {
    if (typeof app !== 'undefined' && app) app.adminRotationDirty = true;
    return { normalized, saveResult: saveResult || { ok: false, reason: 'admin-required' }, ruleCheck, manualOverrideIssues, preservedDraft: true };
  }
  app.rotation = normalizedRotation;
  app.selectedMonth = monthKey;
  app.adminRotationDirty = false;
  saveRotationData();
  renderRotace();
  if (typeof renderMonth === 'function') renderMonth(monthKey);
  if (app.selectedName && typeof renderPerson === 'function') renderPerson(app.selectedName);
  try {
    if (typeof adminRotationGeneratorClearPendingDraft === 'function') adminRotationGeneratorClearPendingDraft(monthKey);
  } catch (err) {}
  return { normalized, saveResult, ruleCheck, manualOverrideIssues };
}'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          # 3) Save handler: only manual edits get confirmation + optional override.
          path = root / 'app-menu.js'
          text = path.read_text(encoding='utf-8')
          start = text.index("      if (adminAction === 'save-rotation') {")
          end = text.index("      if (adminAction === 'load-food-schedule') {", start)
          replacement = r'''      if (adminAction === 'save-rotation') {
        const isManualEdit = !!(typeof app !== 'undefined' && app && app.adminRotationDirty === true);
        let saveOptions = null;
        if (isManualEdit) {
          const manualMonth = readAdminRotationFromDom(monthKey);
          const overrideState = adminRotationBuildManualRuleOverrideState(monthKey, manualMonth);
          if (overrideState.blockingIssues.length && !adminRotationConfirmManualRuleOverride(overrideState)) {
            const cancelledStatus = document.getElementById('adminOnlineSaveStatus') || document.getElementById('adminRotationDraftStatus');
            if (cancelledStatus) cancelledStatus.textContent = 'Uložení zrušeno · rozepsané změny zůstaly v editoru.';
            return;
          }
          saveOptions = {
            normalizedMonth: overrideState.normalized,
            ruleCheck: overrideState.ruleCheck,
            manualOverride: true,
            allowRuleViolations: true,
            manualOverrideIssues: overrideState.blockingIssues
          };
        }
        const result = await saveAdminRotationFromDom(monthKey, saveOptions);
        const saveResult = result && result.saveResult ? result.saveResult : null;
        const ruleWarnings = result && result.ruleCheck && Array.isArray(result.ruleCheck.issues)
          ? result.ruleCheck.issues.filter((issue) => issue && issue.severity === 'warn')
          : [];
        const manualOverrideIssues = result && Array.isArray(result.manualOverrideIssues) ? result.manualOverrideIssues : [];
        const baseText = saveResult && saveResult.ok === true
          ? (saveResult.queued
              ? 'Rozpis uložený lokálně ✓ · po připojení se synchronizuje'
              : ('Rozpis uložený online ✓ · měsíců: ' + String(saveResult.months || 0) + ' · řádků: ' + String(saveResult.entries || 0)))
          : 'Rozpis se nepodařilo uložit online.';
        const statusText = manualOverrideIssues.length && typeof adminRotationFormatRuleIssues === 'function'
          ? baseText + ' · Uloženo přes varování: ' + adminRotationFormatRuleIssues(manualOverrideIssues)
          : (ruleWarnings.length && typeof adminRotationFormatRuleIssues === 'function'
              ? baseText + ' · Kontrola: ' + adminRotationFormatRuleIssues(ruleWarnings)
              : baseText);
        if (saveResult && saveResult.ok === true) renderAdminMenuBody(body, currentView);
        const statusEl = document.getElementById('adminOnlineSaveStatus');
        if (statusEl) statusEl.textContent = saveResult && saveResult.ok === true
          ? statusText
          : 'Rozpis se nepodařilo uložit online. Rozepsané změny zůstaly v editoru.';
        return;
      }
'''
          text = text[:start] + replacement + text[end:]

          # Ensure select-only press rotation changes also mark the editor dirty on iOS/change events.
          change_anchor = "    if (!target || typeof target.matches !== 'function') return;\n"
          change_pos = text.index("  body.addEventListener('change', (event) => {")
          anchor_pos = text.index(change_anchor, change_pos) + len(change_anchor)
          change_insert = "    if (target.matches('[data-press-rotation-date]') && typeof app !== 'undefined' && app) app.adminRotationDirty = true;\n"
          if change_insert not in text:
            text = text[:anchor_pos] + change_insert + text[anchor_pos:]
          path.write_text(text, encoding='utf-8')

          # 4) Version sync.
          path = root / 'app.js'
          text = path.read_text(encoding='utf-8')
          assert text.count('1.5.77') >= 2, 'app.js v1.5.77 anchors missing'
          text = text.replace('1.5.77', '1.5.78')
          path.write_text(text, encoding='utf-8')

          path = root / 'package.json'
          pkg = json.loads(path.read_text(encoding='utf-8'))
          assert pkg.get('version') == '1.5.77', 'package version is not 1.5.77'
          pkg['version'] = '1.5.78'
          path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = root / 'sw.js'
          text = path.read_text(encoding='utf-8')
          assert "const CACHE_VERSION = 'v1.5.77';" in text, 'sw.js v1.5.77 anchor missing'
          text = text.replace("const CACHE_VERSION = 'v1.5.77';", "const CACHE_VERSION = 'v1.5.78';", 1)
          path.write_text(text, encoding='utf-8')

          # 5) Permanent critical guard.
          path = root / 'tools/critical-runtime-smoke.mjs'
          text = path.read_text(encoding='utf-8')
          read_anchor = "const dashboardJs = read('dashboard.js');\n"
          assert read_anchor in text, 'critical smoke read anchor missing'
          reads = "const adminRotationJsV1578 = read('admin-rotation.js');\nconst adminRotationEditorJsV1578 = read('admin-rotation-editor.js');\nconst appMenuJsV1578 = read('app-menu.js');\n"
          if 'const adminRotationJsV1578' not in text:
            text = text.replace(read_anchor, read_anchor + reads, 1)
          log_anchor = "console.log('[critical-runtime-smoke] OK"
          log_pos = text.index(log_anchor)
          assertions = r'''assert(adminRotationJsV1578.includes("opts.source === 'manual-save'"), 'v1.5.78 solo-frézka kontrola musí být jen pro ruční uložení');
assert(adminRotationJsV1578.includes("'consecutive-solo-mill'"), 'v1.5.78 chybí kontrola 2× sám na frézkách');
assert(adminRotationEditorJsV1578.includes('function adminRotationBuildManualRuleOverrideState'), 'v1.5.78 chybí porovnání ručních porušení proti uloženému rozpisu');
assert(adminRotationEditorJsV1578.includes('function adminRotationConfirmManualRuleOverride'), 'v1.5.78 chybí potvrzení ruční výjimky');
assert(adminRotationEditorJsV1578.includes('opts.allowRuleViolations !== true'), 'v1.5.78 save musí zůstat přísný bez explicitní ruční výjimky');
assert(appMenuJsV1578.includes('const isManualEdit = !!'), 'v1.5.78 potvrzení musí být navázané jen na ruční editaci');
assert(appMenuJsV1578.includes('allowRuleViolations: true'), 'v1.5.78 ruční potvrzení musí umět explicitně povolit uložení');
assert(appMenuJsV1578.includes("target.matches('[data-press-rotation-date]')") && appMenuJsV1578.includes('app.adminRotationDirty = true'), 'v1.5.78 změna rotace TNKS01/TPKW01 musí označit editor jako ručně změněný');

'''
          if "v1.5.78 solo-frézka kontrola" not in text:
            text = text[:log_pos] + assertions + text[log_pos:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Focused manual-save guard
        shell: bash
        run: |
          node --check admin-rotation.js
          node --check admin-rotation-editor.js
          node --check app-menu.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          a = Path('admin-rotation.js').read_text(encoding='utf-8')
          e = Path('admin-rotation-editor.js').read_text(encoding='utf-8')
          m = Path('app-menu.js').read_text(encoding='utf-8')
          assert "opts.source === 'manual-save'" in a
          assert "'consecutive-solo-mill'" in a
          assert 'baselineKeys' in e and 'blockingIssues' in e
          assert 'allowRuleViolations: true' in m
          assert 'Uložení zrušeno · rozepsané změny zůstaly v editoru.' in m
          print('OK v1.5.78 manual override focused guard')
          PY

      - name: Full repository check
        run: npm run check

      - name: Commit final v1.5.78
        shell: bash
        run: |
          rm -f .github/workflows/rak-v1578-manual-rotation-rule-override.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow confirmed manual rotation rule overrides in v1.5.78"
          git push origin HEAD:development
