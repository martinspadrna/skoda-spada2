name: RaK v1.5.78 manual rotation rule override

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1578-manual-rotation-rule-override.yml'
      - 'tools/rak-v1578-manual-rotation-rule-override.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Implement v1.5.78
        run: python tools/rak-v1578-manual-rotation-rule-override.py

      - name: Focused manual-save guard
        shell: bash
        run: |
          node --check admin-rotation.js
          node --check admin-rotation-editor.js
          node --check app-menu.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          a = Path('admin-rotation.js').read_text(encoding='utf-8')
          e = Path('admin-rotation-editor.js').read_text(encoding='utf-8')
          m = Path('app-menu.js').read_text(encoding='utf-8')
          assert "opts.source === 'manual-save'" in a
          assert "'consecutive-solo-mill'" in a
          assert 'baselineKeys' in e and 'blockingIssues' in e
          assert 'allowRuleViolations: true' in m
          assert 'Uložení zrušeno · rozepsané změny zůstaly v editoru.' in m
          print('OK v1.5.78 manual override focused guard')
          PY

      - name: Full repository check
        run: npm run check

      - name: Commit final v1.5.78
        shell: bash
        run: |
          rm -f .github/workflows/rak-v1578-manual-rotation-rule-override.yml
          rm -f tools/rak-v1578-manual-rotation-rule-override.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow confirmed manual rotation rule overrides in v1.5.78"
          git push origin HEAD:development
