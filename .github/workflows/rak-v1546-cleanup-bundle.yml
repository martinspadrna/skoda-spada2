name: RaK v1.5.46 cleanup bundle

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/rak-v1546-cleanup-bundle.yml'
      - 'tools/rak-v1546-migrate.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: python3 tools/rak-v1546-migrate.py
      - name: Syntax check touched files
        run: |
          node --check app.js
          node --check app-menu.js
          node --check tools/defer-heavy-libs.mjs
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit cleanup bundle after checks pass
        run: |
          rm .github/workflows/rak-v1546-cleanup-bundle.yml
          rm tools/rak-v1546-migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy menu and dashboard fixes in v1.5.46"
          git push origin HEAD:development
