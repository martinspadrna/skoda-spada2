name: RaK v1.5.70 rotation month CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - 'tools/rak-v1570-extract-rotation-month-css.py'
      - '.github/workflows/rak-v1570-extract-rotation-month-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move rotation month CSS to owner
        run: python3 tools/rak-v1570-extract-rotation-month-css.py

      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text(encoding='utf-8')
          a=i.index('styles-admin-rotation-fold.css')
          b=i.index('styles-rotation-month.css')
          c=i.index('styles-overrides-legacy-mid.css')
          assert a < b < c
          owner=Path('styles-rotation-month.css').read_text(encoding='utf-8')
          legacy=Path('styles-overrides-legacy-mid.css').read_text(encoding='utf-8')
          assert '.rotationViewFold{' in owner
          assert '#monthView table.rotTable{' in owner
          assert 'body.ladaMode' not in owner
          assert legacy.startswith('/* v.1.1 (725): Láďův režim turbo')
          print('rotation-month owner bytes:', len(owner.encode('utf-8')), 'cascade positions:', a, b, c)
          PY

      - name: Full repository check
        run: npm run check

      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1570-extract-rotation-month-css.yml tools/rak-v1570-extract-rotation-month-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move rotation month CSS to owner in v1.5.70"
          git push origin development
