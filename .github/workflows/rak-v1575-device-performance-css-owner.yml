name: RaK v1.5.75 device performance CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - 'tools/rak-v1575-device-performance-css-owner.py'
      - '.github/workflows/rak-v1575-device-performance-css-owner.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move device performance CSS to owner
        run: python3 tools/rak-v1575-device-performance-css-owner.py

      - name: Verify focused ownership move
        run: |
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          owner = Path('styles-device-performance-settings.css').read_text(encoding='utf-8')
          legacy = Path('styles-overrides-legacy-mid.css').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          assert owner.startswith('/* RaK v1.5.75 – owner: Nastavení → Výkon / device performance card */')
          assert '.rakDevicePerfCard{' in owner and '.rakDevicePerfActions{' in owner
          assert '#appMenuBody .appMenuProfileCard' not in owner
          assert legacy.startswith('/* v.1.5 (747): Více → Nastavení – kompaktnější profil, výkon a tlačítka ve dvou sloupcích. */')
          assert index.count('styles-device-performance-settings.css') == 1
          assert index.index('styles-admin-service.css') < index.index('styles-device-performance-settings.css') < index.index('styles-overrides-legacy-mid.css')
          assert json.loads(Path('package.json').read_text(encoding='utf-8'))['version'] == '1.5.75'
          assert 'RAK_MODULE_CACHE_VERSION = "1.5.75"' in Path('app.js').read_text(encoding='utf-8')
          assert "CACHE_VERSION = 'v1.5.75'" in Path('sw.js').read_text(encoding='utf-8')
          print('focused v1.5.75 ownership guard OK')
          PY
          git diff --check

      - name: Full repository check
        run: npm run check

      - name: Commit v1.5.75 after checks pass
        run: |
          rm -f .github/workflows/rak-v1575-device-performance-css-owner.yml tools/rak-v1575-device-performance-css-owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move device performance settings CSS to owner in v1.5.75"
          git push origin development
