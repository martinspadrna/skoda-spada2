name: RaK v1.5.62 rotation CSS inventory cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1562-dedupe-rotation-css.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inventory and deduplicate proven Rotace CSS
        run: python3 tools/rak-v1562-dedupe-rotation-css.py
      - name: Verify focused cleanup guards
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('styles-overrides-legacy-early.css'), Path('styles-overrides-legacy-mid.css'), Path('styles-overrides-legacy-late.css')]
          assert 'RaK v1.5.62 – proven Rotace legacy dedupe + inventory' in files[0].read_text()
          print('Legacy CSS bytes:', [len(p.read_text()) for p in files])
          print('Viewport polish bytes:', len(Path('styles-viewport-polish.css').read_text()))
          print('Release polish bytes:', len(Path('styles-release-polish.css').read_text()))
          print('Rotation tasks bytes:', len(Path('styles-rotation-tasks.css').read_text()))
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit cleanup after checks pass
        run: |
          rm -f .github/workflows/rak-v1562-dedupe-rotation-css.yml tools/rak-v1562-dedupe-rotation-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deduplicate Rotace legacy CSS in v1.5.62"
          git push origin development
