name: RaK v1.5.39 safe migration

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare safe v1.5.39 migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib

          def dec(value):
              return zlib.decompress(base64.b64decode(value)).decode('utf-8')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          report = Path('rak-shift-report.js')
          text = report.read_text()
          if "const INDEX_ORDER = { AG: 0, AE: 0, AF: 1, AD: 1, AH: 2 };" in text:
              raise SystemExit('Report formatting already migrated')
          replace_once('rak-shift-report.js', dec('eNpTUEjOzysuUfD0c3GNiHf29/EPClawVahWcHSzUlBPyilNVddRcHQHstOLUlPzQBwPICe/KDEvHSzlgqTMFa5ModaaCwCaRhk0'), dec('eNpTUEjOzysuUfD0c3GNiHf29/EPClawVahWcHSzUlBPyilNVddRcHQHstOLUlPzQBwPICe/KDEvHSzlgqTMFa5ModaaSwHFaP8gF9cgiMlA0wwgqkEU0B5DiDmGEMONkDUHuQb4B4XEB7sGOAY5hviDTFCPhwN1ay4A4S0zyg=='))
          replace_once('rak-shift-report.js', dec(''), dec(''))

          replace_once('app.js', 'const RAK_MODULE_CACHE_VERSION = "1.5.38";', 'const RAK_MODULE_CACHE_VERSION = "1.5.39";')
          replace_once('app.js', 'const RAK_DEV_UPDATE_BUILD = "v1.5.38";', 'const RAK_DEV_UPDATE_BUILD = "v1.5.39";')
          replace_once('package.json', '"version": "1.5.38"', '"version": "1.5.39"')
          replace_once('sw.js', "const CACHE_VERSION = 'v1.5.38';", "const CACHE_VERSION = 'v1.5.39';")

          smoke = Path('tools/critical-runtime-smoke.mjs')
          s = smoke.read_text()
          read_anchor = "const shiftReportEntryFix = read('rak-shift-report-entry-fix.js');\n"
          read_new = read_anchor + "const shiftReport = read('rak-shift-report.js');\n"
          if s.count(read_anchor) != 1:
              raise SystemExit('Smoke read anchor mismatch')
          s = s.replace(read_anchor, read_new, 1)
          assert_anchor = "assert(shiftReportEntryFix.includes('const anchor = vacationReportButton || nativeReportButton || adminButton;'), 'Report směny musí preferovat Report dovolené jako viditelnou kotvu pořadí');\n"
          assert_new = assert_anchor + (
              "assert(shiftReport.includes(\"const INDEX_ORDER = { AG: 0, AE: 0, AF: 1, AD: 1, AH: 2 };\"), 'Hlavní report modul musí držet ověřené pořadí indexů');\n"
              "assert(shiftReport.includes(\"const REPORT_SEPARATOR = '__________';\"), 'Hlavní report modul musí držet oddělovače provozních bloků');\n"
              "assert(shiftReport.includes(\"return sortReportRowsByIndexColor(formatShiftReportText(lines.join('\\\\n').trim()));\"), 'Finální text reportu se musí formátovat a řadit už v hlavním modulu');\n"
          )
          if s.count(assert_anchor) != 1:
              raise SystemExit('Smoke assertion anchor mismatch')
          smoke.write_text(s.replace(assert_anchor, assert_new, 1))
          PY

          node --check rak-shift-report.js
          node --check tools/critical-runtime-smoke.mjs
          npm run check

      - name: Commit verified v1.5.39
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rak-v1539-safe-migrate.yml
          git add app.js package.json sw.js rak-shift-report.js tools/critical-runtime-smoke.mjs
          git commit -m "Move shift report formatting into main module in v1.5.39"
          git push origin HEAD:development
