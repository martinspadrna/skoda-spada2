name: RaK v1.5.59 nav layout CSS dedupe

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1559-dedupe-nav-layout-css.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deduplicate proven nav and layout CSS
        run: python3 tools/rak-v1559-dedupe-nav-layout-css.py
      - name: Verify focused cleanup guards
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('styles-overrides-legacy-early.css'), Path('styles-overrides-legacy-mid.css'), Path('styles-overrides-legacy-late.css')]
          text = '\n'.join(p.read_text() for p in files)
          clean = re.sub(r'/\*[\s\S]*?\*/', '', text, flags=re.M).lower()
          for dead in ('.bottomnavgamesbtn', '[data-page="games"]', "[data-page='games']", '[data-action="page-games"]', "[data-action='page-games']"):
              assert dead not in clean, dead
          assert 'rak v1.5.59 – proven nav/layout legacy dedupe' in files[0].read_text().lower()
          print('legacy CSS bytes:', [len(p.read_text()) for p in files])
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit cleanup after checks pass
        run: |
          rm -f .github/workflows/rak-v1559-dedupe-nav-layout-css.yml tools/rak-v1559-dedupe-nav-layout-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deduplicate nav and layout legacy CSS in v1.5.59"
          git push origin development
