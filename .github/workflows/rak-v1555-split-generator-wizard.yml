name: RaK v1.5.55 generator wizard split

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1555-split-generator-wizard.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply generator wizard split
        run: python3 tools/rak-v1555-split-generator-wizard.py
      - name: Syntax check touched files
        run: |
          node --check admin-rotation-generator.js
          node --check admin-rotation-generator-wizard.js
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit split after checks pass
        run: |
          rm -f .github/workflows/rak-v1555-split-generator-wizard.yml tools/rak-v1555-split-generator-wizard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split generator engine and wizard in v1.5.55"
          git push origin development
