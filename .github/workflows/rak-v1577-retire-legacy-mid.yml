name: RaK v1.5.77 retire legacy-mid

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1577-retire-legacy-mid.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Retire complete legacy-mid layer
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"

      - name: Verify focused retirement
        shell: bash
        run: |
          test ! -e styles-overrides-legacy-mid.css
          test -e styles-admin-rotation-editor.css
          test -e styles-bottom-nav-runtime.css
          grep -q 'styles-admin-rotation-editor.css' index.html
          grep -q 'styles-bottom-nav-runtime.css' index.html
          if grep -q 'styles-overrides-legacy-mid.css' index.html; then exit 1; fi
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          node -e "const p=require('./package.json'); if(p.version!=='1.5.77') process.exit(1)"
          git diff --check

      - name: Full repository check
        run: npm run check

      - name: Commit v1.5.77 after checks pass
        shell: bash
        run: |
          rm -f .github/workflows/rak-v1577-retire-legacy-mid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire complete legacy-mid CSS layer in v1.5.77"
          git push origin development
