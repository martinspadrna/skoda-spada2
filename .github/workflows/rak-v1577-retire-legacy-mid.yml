name: RaK v1.5.77 retire legacy-mid

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1577-retire-legacy-mid.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Retire complete legacy-mid layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r = Path('.')
          lp = r / 'styles-overrides-legacy-mid.css'
          ap = r / 'styles-admin-rotation-editor.css'
          np = r / 'styles-bottom-nav-runtime.css'
          ip = r / 'index.html'
          sp = r / 'tools/critical-runtime-smoke.mjs'
          x = lp.read_text(encoding='utf-8')
          am = '/* v.1.5 (788): Administrace rozpisů – rychlé Odebrat a ochrana editace při oddálení. */'
          nm = '/* v.1.5 (792): Globální spodní lišta pevně ukotvená dole + obsah vždy nad ní. */'
          assert x.startswith(am)
          p = x.find(nm)
          assert p > 0
          a = x[:p].rstrip() + '\n'
          n = x[p:].rstrip() + '\n'
          assert '.adminRotationQuickRemove{' in a and '.adminRotationSaveDock{' in a and '.adminRotationCompactOverview{' in a and '.bottomNav{' not in a
          assert n.startswith(nm) and '.bottomNav{' in n and '--bottom-nav-h:56px;' in n and 'adminRotation' not in n
          assert not ap.exists() and not np.exists()
          a = a.replace(am, am + '\n/* RaK v1.5.77 – owner: Administrace → Rozpisy / editor + iOS guard */', 1)
          n = n.replace(nm, nm + '\n/* RaK v1.5.77 – owner: globální spodní navigace / fixed bottom runtime */', 1)
          ap.write_text(a, encoding='utf-8')
          np.write_text(n, encoding='utf-8')
          lp.unlink()
          h = ip.read_text(encoding='utf-8')
          old = '<link rel="stylesheet" href="styles-overrides-legacy-mid.css">'
          new = '<link rel="stylesheet" href="styles-admin-rotation-editor.css">\n<link rel="stylesheet" href="styles-bottom-nav-runtime.css">'
          assert h.count(old) == 1
          ip.write_text(h.replace(old, new, 1), encoding='utf-8')
          s = sp.read_text(encoding='utf-8')
          oldread = "const stylesOverridesLegacyMidCss = read('styles-overrides-legacy-mid.css');\n"
          newread = "const stylesAdminRotationEditorCss = read('styles-admin-rotation-editor.css');\nconst stylesBottomNavRuntimeCss = read('styles-bottom-nav-runtime.css');\nconst stylesOverridesLegacyMidCss = stylesAdminRotationEditorCss + '\\n' + stylesBottomNavRuntimeCss;\n"
          assert oldread in s
          s = s.replace(oldread, newread, 1)
          oldpos = "indexHtml.indexOf('styles-overrides-legacy-mid.css')"
          c = s.count(oldpos)
          assert c >= 6
          s = s.replace(oldpos, "indexHtml.indexOf('styles-bottom-nav-runtime.css')")
          anchor = "assert(vercelIgnoreBuild.includes('VERCEL_GIT_PREVIOUS_SHA') && vercelIgnoreBuild.includes('helperOnly'), 'Vercel ignore guard musí porovnávat změněné soubory');"
          assert anchor in s
          g = """assert(!fs.existsSync(path.join(root, 'styles-overrides-legacy-mid.css')), 'v1.5.77 legacy-mid musí být odstraněn');
          assert(!indexHtml.includes('styles-overrides-legacy-mid.css'), 'v1.5.77 legacy-mid nesmí být v indexu');
          assert(stylesAdminRotationEditorCss.includes('RaK v1.5.77 – owner: Administrace → Rozpisy / editor + iOS guard'), 'Chybí v1.5.77 admin rotation editor owner');
          assert(stylesAdminRotationEditorCss.includes('.adminRotationQuickRemove{') && stylesAdminRotationEditorCss.includes('.adminRotationSaveDock{') && stylesAdminRotationEditorCss.includes('.adminRotationCompactOverview{'), 'Admin rotation editor owner je neúplný');
          assert(!stylesAdminRotationEditorCss.includes('.bottomNav{'), 'Admin rotation editor nesmí obsahovat bottom nav');
          assert(stylesBottomNavRuntimeCss.includes('RaK v1.5.77 – owner: globální spodní navigace / fixed bottom runtime'), 'Chybí v1.5.77 bottom nav owner');
          assert(stylesBottomNavRuntimeCss.includes('--bottom-nav-h:56px;') && stylesBottomNavRuntimeCss.includes('.bottomNav{'), 'Bottom nav owner je neúplný');
          assert(!stylesBottomNavRuntimeCss.includes('adminRotation'), 'Bottom nav owner nesmí obsahovat admin rotation');
          const adminRotationEditorCssPosV1577 = indexHtml.indexOf('styles-admin-rotation-editor.css');
          const bottomNavRuntimeCssPosV1577 = indexHtml.indexOf('styles-bottom-nav-runtime.css');
          assert(adminRotationEditorCssPosV1577 >= 0 && adminRotationEditorCssPosV1577 < bottomNavRuntimeCssPosV1577, 'v1.5.77 owner pořadí musí být Admin Rotation → Bottom Nav');"""
          s = s.replace(anchor, anchor + '\n' + g.strip(), 1)
          sp.write_text(s, encoding='utf-8')
          pth = r / 'app.js'
          t = pth.read_text(encoding='utf-8')
          assert t.count('1.5.76') >= 2
          pth.write_text(t.replace('1.5.76', '1.5.77'), encoding='utf-8')
          pth = r / 'package.json'
          j = json.loads(pth.read_text(encoding='utf-8'))
          assert j['version'] == '1.5.76'
          j['version'] = '1.5.77'
          pth.write_text(json.dumps(j, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          pth = r / 'sw.js'
          t = pth.read_text(encoding='utf-8')
          assert "CACHE_VERSION = 'v1.5.76'" in t
          pth.write_text(t.replace("CACHE_VERSION = 'v1.5.76'", "CACHE_VERSION = 'v1.5.77'", 1), encoding='utf-8')
          print('legacy-mid removed bytes', len(x.encode()))
          print('admin owner bytes', len(a.encode()))
          print('bottom nav owner bytes', len(n.encode()))
          print('cascade anchors migrated', c)
          PY

      - name: Verify focused retirement
        shell: bash
        run: |
          test ! -e styles-overrides-legacy-mid.css
          test -e styles-admin-rotation-editor.css
          test -e styles-bottom-nav-runtime.css
          grep -q 'styles-admin-rotation-editor.css' index.html
          grep -q 'styles-bottom-nav-runtime.css' index.html
          if grep -q 'styles-overrides-legacy-mid.css' index.html; then exit 1; fi
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          node -e "const p=require('./package.json'); if(p.version!=='1.5.77') process.exit(1)"
          git diff --check

      - name: Full repository check
        run: npm run check

      - name: Commit v1.5.77 after checks pass
        shell: bash
        run: |
          rm -f .github/workflows/rak-v1577-retire-legacy-mid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire complete legacy-mid CSS layer in v1.5.77"
          git push origin development
