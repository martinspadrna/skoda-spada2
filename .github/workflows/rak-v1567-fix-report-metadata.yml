name: RaK v1.5.67 report metadata fix

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1567-fix-report-metadata.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix report metadata model
        run: python3 tools/rak-v1567-fix-report-metadata.py
      - name: Verify focused report metadata guards
        run: |
          node --check app-menu-bug-report.js
          node --check admin-reports.js
          node --check supabase-bridge.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          bug=Path('app-menu-bug-report.js').read_text()
          admin=Path('admin-reports.js').read_text()
          bridge=Path('supabase-bridge.js').read_text()
          assert 'appearanceId: appearance.id' in bug
          assert 'appearanceLabel: appearance.label' in bug
          assert 'window.RAK_PWA_BUILD' in bug
          assert 'theme,' not in bug
          assert 'background,' not in bug
          assert "'Vzhled ' + String(appearance.label)" in admin
          assert "'Theme ' + String(device.theme)" not in admin
          assert "'Pozadí ' + String(device.background)" not in admin
          assert 'appearanceId: String(source.appearanceId' in bridge
          assert "theme: String(source.theme || '').slice(0, 80)" not in bridge
          print('v1.5.67 focused report metadata guard OK')
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit fix after checks pass
        run: |
          rm -f .github/workflows/rak-v1567-fix-report-metadata.yml tools/rak-v1567-fix-report-metadata.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix report appearance metadata in v1.5.67"
          git push origin development
