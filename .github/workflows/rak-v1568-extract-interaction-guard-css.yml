name: RaK v1.5.68 interaction guard CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1568-extract-interaction-guard-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move interaction guard CSS to owner
        run: python3 tools/rak-v1568-extract-interaction-guard-css.py
      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text()
          a=i.index('styles-admin-reports.css')
          b=i.index('styles-interaction-guard.css')
          c=i.index('styles-overrides-legacy-mid.css')
          assert a < b < c
          owner=Path('styles-interaction-guard.css').read_text()
          legacy=Path('styles-overrides-legacy-mid.css').read_text()
          assert 'html, body, body *{' in owner
          assert '[contenteditable="true"], .allowTextSelect, .selectableText' in owner
          assert ':is(#soustruhy,#frezky,#brusy,.calcPage) input{' in owner
          assert '.appMenuFoldSection.adminRotationFold' not in owner
          assert legacy.startswith('.appMenuFoldSection.adminRotationFold{')
          print('interaction-guard owner bytes:',len(owner),'cascade positions:',a,b,c)
          PY
      - name: Full repository check
        run: npm run check
      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1568-extract-interaction-guard-css.yml tools/rak-v1568-extract-interaction-guard-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move interaction guard CSS to owner in v1.5.68"
          git push origin development
