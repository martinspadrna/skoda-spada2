name: RaK development smoke

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: rak-development-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser + release regression
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Syntax, release, security and mobile browser smoke
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:release
