name: RaK v1.5.80 rotation override dialog retry

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/rak-v1580-rotation-override-dialog.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Implement v1.5.80
        run: |
          python3 tools/rak-v1580-rotation-override-dialog.py
          python3 tools/rak-v1580-retire-v1579-smoke.py

      - name: Focused v1.5.80 guard
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-rotation-editor.js
          node --check app-menu.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          grep -q "saveBtn.textContent = 'Přesto uložit';" admin-rotation-editor.js
          grep -q "closeBtn.textContent = 'Zavřít';" admin-rotation-editor.js
          grep -q "const confirmed = await adminRotationConfirmManualRuleOverride(overrideState);" app-menu.js
          grep -q '"version": "1.5.80"' package.json
          if grep -q "window.confirm(text)" admin-rotation-editor.js; then exit 1; fi

      - name: Full repository check
        run: npm run check

      - name: Commit final v1.5.80
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rak-v1580-rotation-override-dialog.yml
          rm -f tools/rak-v1580-rotation-override-dialog.py
          rm -f tools/rak-v1580-retire-v1579-smoke.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add two-button rotation override dialog in v1.5.80"
          git push origin HEAD:development
