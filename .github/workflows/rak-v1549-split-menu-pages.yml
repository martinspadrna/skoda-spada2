name: RaK v1.5.49 menu pages split

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1549-split-menu-pages.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply menu pages split
        run: python3 tools/rak-v1549-split-menu-pages.py
      - name: Syntax check touched files
        run: |
          node --check app.js
          node --check app-menu.js
          node --check app-menu-pages.js
          node --check app-menu-bug-report.js
          node --check app-menu-profile.js
          node --check app-menu-shift-report.js
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit split after checks pass
        shell: bash
        run: |
          rm tools/rak-v1549-split-menu-pages.py
          rm .github/workflows/rak-v1549-split-menu-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split standard pages from app-menu in v1.5.49"
          git push origin HEAD:development
