name: RaK v1.5.51 admin menu split

on:
  push:
    branches: [development]
    paths:
      - 'tools/rak-v1551-split-admin-menu.py'
      - '.github/workflows/rak-v1551-split-admin-menu.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply admin menu split
        run: python3 tools/rak-v1551-split-admin-menu.py
      - name: Syntax check touched menu files
        run: |
          node --check app-menu-admin-export.js
          node --check app-menu-admin-core.js
          node --check app-menu.js
          node --check app.js
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit split after checks pass
        run: |
          rm -f tools/rak-v1551-split-admin-menu.py
          rm -f .github/workflows/rak-v1551-split-admin-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split admin core from app-menu in v1.5.51"
          git push origin HEAD:development
