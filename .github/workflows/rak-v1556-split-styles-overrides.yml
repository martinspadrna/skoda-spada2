name: RaK v1.5.56 CSS monolith split

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1556-split-styles-overrides.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply CSS monolith split
        run: python3 tools/rak-v1556-split-styles-overrides.py
      - name: Verify CSS reconstruction and source references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = [Path('styles-overrides-legacy-early.css').read_text(), Path('styles-overrides-legacy-mid.css').read_text(), Path('styles-overrides-legacy-late.css').read_text()]
          assert all(len(p) > 100000 for p in parts)
          assert not Path('styles-overrides.css').exists()
          print('CSS parts:', [len(p) for p in parts], 'total', sum(map(len, parts)))
          PY
          node --check app.js
          node --check app-health-audits.js
          node --check rak-export-release-audit.js
          node --check app-usage-smoke-v963.js
          node --check export.js
          node --check tools/critical-runtime-smoke.mjs
      - name: Full repository check
        run: npm run check
      - name: Commit split after checks pass
        run: |
          rm -f .github/workflows/rak-v1556-split-styles-overrides.yml tools/rak-v1556-split-styles-overrides.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split legacy CSS monolith in v1.5.56"
          git push origin development

# final retry after critical smoke anchor fix
