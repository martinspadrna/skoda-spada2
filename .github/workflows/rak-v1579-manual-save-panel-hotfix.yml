name: RaK v1.5.79 manual save warning hotfix

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1579-manual-save-panel-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Implement v1.5.79
        run: python3 tools/rak-v1579-manual-save-panel-hotfix.py

      - name: Focused v1.5.79 guard
        shell: bash
        run: |
          node --check admin-rotation-editor.js
          node --check app-menu.js
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          grep -q "function adminRotationHasManualDomChanges" admin-rotation-editor.js
          grep -q "adminRotationHasManualDomChanges(monthKey, manualMonth)" app-menu.js
          grep -q "RaK v1.5.79 – Kontrola měsíce celá viditelná" styles-admin-rotation-editor.css
          grep -q '"version": "1.5.79"' package.json
          if grep -q "baselineKeys\|baselineCheck" admin-rotation-editor.js; then exit 1; fi

      - name: Full repository check
        run: npm run check

      - name: Commit final v1.5.79
        shell: bash
        run: |
          rm -f .github/workflows/rak-v1579-manual-save-panel-hotfix.yml
          rm -f tools/rak-v1579-manual-save-panel-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix manual rotation warning gate and month panel in v1.5.79"
          git push origin HEAD:development
