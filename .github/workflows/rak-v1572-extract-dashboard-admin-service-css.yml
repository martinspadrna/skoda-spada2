name: RaK v1.5.72 Dashboard and admin service CSS ownership move

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v1572-extract-dashboard-admin-service-css.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move Dashboard sync and admin service CSS to owners
        run: python3 tools/rak-v1572-extract-dashboard-admin-service-css.py

      - name: Verify ownership and cascade position
        run: |
          node --check tools/critical-runtime-smoke.mjs
          node tools/critical-runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          i = Path('index.html').read_text(encoding='utf-8')
          a = i.index('styles-low-end-performance.css')
          b = i.index('styles-dashboard-sync.css')
          c = i.index('styles-admin-service.css')
          d = i.index('styles-overrides-legacy-mid.css')
          assert a < b < c < d
          dash = Path('styles-dashboard-sync.css').read_text(encoding='utf-8')
          admin = Path('styles-admin-service.css').read_text(encoding='utf-8')
          legacy = Path('styles-overrides-legacy-mid.css').read_text(encoding='utf-8')
          assert '.dashboardSyncBadge{' in dash and '.adminService' not in dash
          assert '.adminServiceGrid{' in admin and '.dashboardSyncBadge' not in admin and '.rakDevicePerfCard' not in admin
          assert legacy.startswith('/* v.1.1 (725) – výkon zařízení / Láďův režim v nastavení */')
          assert '1.5.72' in Path('app.js').read_text(encoding='utf-8')
          assert json.loads(Path('package.json').read_text(encoding='utf-8'))['version'] == '1.5.72'
          assert "CACHE_VERSION = 'v1.5.72'" in Path('sw.js').read_text(encoding='utf-8')
          print('dashboard-sync owner bytes:', len(dash.encode('utf-8')))
          print('admin-service owner bytes:', len(admin.encode('utf-8')), 'cascade positions:', a, b, c, d)
          PY
          git diff --check

      - name: Full repository check
        run: npm run check

      - name: Commit migration after checks pass
        run: |
          rm -f .github/workflows/rak-v1572-extract-dashboard-admin-service-css.yml tools/rak-v1572-extract-dashboard-admin-service-css.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Dashboard sync and admin service CSS to owners in v1.5.72"
          git push origin development
